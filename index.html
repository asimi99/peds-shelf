<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="strict-origin-when-cross-origin"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<script src="https://asimi99.github.io/clerkship-tools/nav.js?v=21" data-noauth data-static></script>
<title>Peds Shelf Video Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a study desk. Sticky top bar with name and search, a source rail on the left on wide screens, the working column on the right. Timestamps are the instrument: mono, tinted by source, always jumping to the exact second. */
:root{
  --bg:#fbfcfd; --surface:#f1f4f7; --raised:#ffffff; --fg:#14202b; --muted:#5b6876; --line:#dce3ea;
  --accent:#1d4f8f; --accent-soft:#e6eef8;
  --hy:#c4231c; --h1:#1d4f8f; --h2:#2f6db5; --e:#b0306c; --d:#a15c00;
  --h1-soft:#e6eef8; --h2-soft:#e8f1fb; --e-soft:#f9e8f0; --d-soft:#fbefdc;
  --display:'Manrope','Helvetica Neue',Arial,sans-serif; --body:'Inter','Helvetica Neue',Arial,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-padding-top:var(--toph,70px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0;padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;text-wrap:balance;margin:0}
b.hy{color:var(--hy);font-weight:700}
u.hy2{text-decoration-thickness:1.5px;text-underline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px;max-width:1240px;margin-inline:auto}
.top h1{font-size:19px;font-weight:800;line-height:1.15;min-width:0}
.top h1 a{color:var(--fg)}.top h1 a:hover{text-decoration:none}
.top h1 small{display:block;white-space:normal;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.search{flex:1 1 300px;min-width:0;display:flex}
.search input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}

.wrap{max-width:1240px;margin-inline:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;padding-top:22px}
.rail{position:sticky;top:calc(var(--toph,70px) + 18px);align-self:start;display:grid;gap:2px;font-size:14px;max-height:calc(100vh - var(--toph,70px) - 30px);overflow:auto}
.rail a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;color:var(--fg)}
.rail a:hover{background:var(--surface);text-decoration:none}
.rail a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .k{font-family:var(--mono);font-size:11px;font-weight:600;min-width:24px;text-align:center;padding:1px 0;border-radius:4px}
.rail .sep{height:1px;background:var(--line);margin:8px 10px}
.rail .lab{padding:10px 10px 4px}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:12px}.rail{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:6px;overflow:visible}.rail a{border:1px solid var(--line);padding:6px 10px}.rail .sep,.rail .lab{display:none}}

.ts.h1,.k.h1,.chip.h1{color:var(--h1);background:var(--h1-soft)}.ts.h2,.k.h2,.chip.h2{color:var(--h2);background:var(--h2-soft)}.ts.e,.k.e,.chip.e{color:var(--e);background:var(--e-soft)}.ts.d,.k.d,.chip.d{color:var(--d);background:var(--d-soft)}.k.t{color:var(--fg);background:var(--surface)}

main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-content:start}
.hero h2{font-size:30px;font-weight:800}.hero p{max-width:62ch;color:var(--muted);margin:8px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:grid;gap:6px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--fg)}
.tile:hover{border-color:var(--accent);text-decoration:none}
.tile .tn{font-family:var(--display);font-weight:700;font-size:17px}
.tile .meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.how{display:grid;gap:6px;font-size:14px;color:var(--muted);max-width:70ch}
.how b{color:var(--fg);font-weight:600}

.vhead{display:grid;gap:6px}
.vhead h2{font-size:26px;font-weight:800}
.vhead .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px;align-items:center}
.player{position:sticky;top:calc(var(--toph,70px) + env(safe-area-inset-top,0px));z-index:6;background:var(--bg);padding-block:8px 10px}
.player .frame{position:relative;width:min(100%,calc(42vh*16/9));aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .poster{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:#0b1118 center/cover no-repeat;border:0;width:100%;font-weight:600}
.player .poster span{background:rgba(0,0,0,.6);padding:10px 16px;border-radius:999px}
.note{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;max-width:72ch}

.secs{display:grid;border-top:1px solid var(--line)}
.sec{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:13px 8px;margin-inline:-8px;border-bottom:1px solid var(--line);border-radius:6px;cursor:pointer}
.sec:hover{background:var(--surface)}
.sec .ts::after{content:"";position:absolute;inset:0}
.sec .pg a{position:relative;z-index:1}
.sec.cur{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.ts{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;align-self:start;justify-self:start;padding:3px 8px;border-radius:6px;border:0;white-space:nowrap}
.ts:hover{text-decoration:none;filter:brightness(.95)}
.sec h3{font-size:16px;font-weight:700;margin-bottom:4px}
.sec ul{margin:0;padding-left:18px;display:grid;gap:3px;max-width:76ch}
.sec .pg{font-size:12.5px;color:var(--muted);margin-top:4px}
@media (max-width:520px){.sec{grid-template-columns:minmax(0,1fr);gap:6px}}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.srcbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px}.srcb{font:600 13.5px var(--body);border:1.5px solid var(--line);background:var(--raised);color:var(--muted);border-radius:99px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}.srcb b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;color:#fff}.srcb.h1 b{background:var(--h1)}.srcb.h2 b{background:var(--h2)}.srcb.e b{background:var(--e)}.srcb.d b{background:var(--d)}.srcb.on.h1{color:var(--h1);border-color:var(--h1);background:var(--h1-soft)}.srcb.on.h2{color:var(--h2);border-color:var(--h2);background:var(--h2-soft)}.srcb.on.e{color:var(--e);border-color:var(--e);background:var(--e-soft)}.srcb.on.d{color:var(--d);border-color:var(--d);background:var(--d-soft)}
.chip{font-family:var(--mono);font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:6px;border:0;white-space:nowrap}
.chip:hover{text-decoration:none;filter:brightness(.95)}
.chip.t{white-space:normal;font-family:var(--body);font-weight:500}
main>section{min-width:0}
.srcrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
@media (max-width:520px){.srcrow{grid-template-columns:minmax(0,1fr);gap:4px}}

.fc{display:grid;gap:0;min-width:0}
.fc-root{justify-self:center;max-width:640px;text-align:center;font-family:var(--display);font-weight:700;font-size:16px;padding:10px 16px;border:2px solid var(--fg);border-radius:10px;background:var(--raised);position:relative;margin-bottom:22px}
.fc-root::after{content:"";position:absolute;left:50%;top:100%;height:22px;border-left:2px solid var(--line)}
.fc-br{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;align-items:start;border-top:2px solid var(--line);padding-top:14px}
.fc-br.one{border-top:0;padding-top:0}
.fc-col{display:grid;gap:8px;min-width:0}
.fc-cat{border-radius:10px;padding:10px 12px;border:1.5px solid var(--tc);background:var(--ts)}
.fc-cat h3{font-size:15.5px;color:var(--tc)}
.fc-cat p{margin:4px 0 0;font-size:13.5px;line-height:1.45}
.fc-card{position:relative;border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:8px;background:var(--raised);padding:9px 11px;display:grid;gap:4px;margin-left:10px}
.fc-card::before{content:"";position:absolute;left:-12px;top:16px;width:8px;border-top:2px solid var(--line)}
.fc-card .nm{font-family:var(--display);font-weight:700;font-size:15px}
.fc-card .ex{font-size:13.5px;color:var(--muted)}
.fc-card .uw{font-size:13.5px;line-height:1.45;background:var(--surface);border-radius:6px;padding:6px 8px}
.fc-card .uw span{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tc);margin-right:6px}
.t-a{--tc:#1d4f8f;--ts:#e6eef8}.t-b{--tc:#b3261e;--ts:#fbe9e7}.t-c{--tc:#9a5b00;--ts:#fbefdc}.t-d{--tc:#2e7d32;--ts:#e7f4e8}.t-e{--tc:#6a3ea1;--ts:#f1eafa}
.cmpw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--raised);margin-bottom:22px}.cmp{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px;line-height:1.45}.cmp th,.cmp td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}.cmp thead th{font-family:var(--display);font-size:14.5px;color:var(--tc);background:var(--ts);border-bottom:2px solid var(--tc)}.cmp tbody th{font-family:var(--display);font-size:13px;width:140px;background:var(--surface)}.cmp tr:last-child td,.cmp tr:last-child th{border-bottom:0}
.fc-im{margin-top:18px;display:grid;gap:14px}.fc-im h3{font-size:15.5px;color:var(--tc);margin:0 0 8px}.fc-im .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.fc-im figure{margin:0;border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:8px;background:#fff;padding:6px;display:grid;gap:4px}.fc-im img{width:100%;height:auto;display:block;border-radius:4px;cursor:zoom-in}.fc-im figcaption{font-size:12.5px;color:#333;line-height:1.35}
.fc-keys{display:grid;gap:0;border-top:1px solid var(--line);margin-top:18px}
.fc-keys div{display:grid;grid-template-columns:180px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.fc-keys b{font-family:var(--display)}
@media (max-width:520px){.fc-keys div{grid-template-columns:minmax(0,1fr);gap:2px}}

.chart{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.chart img{display:block;width:100%;height:auto}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.tlist a{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--fg);font-size:14px}
.tlist a:hover{border-color:var(--accent);text-decoration:none}
.tlist .n{font-family:var(--mono);color:var(--muted);font-size:12.5px;padding-top:1px}
.pdfv{width:100%;height:calc(100vh - var(--toph,70px) - 120px);min-height:480px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}
.hits{display:grid;gap:8px}
.hit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raised)}
.hit .t{font-weight:600}.hit .s{font-size:13.5px;color:var(--muted)}
mark{background:color-mix(in srgb,var(--d) 30%,transparent);color:inherit;border-radius:2px}
footer{max-width:1240px;margin:48px auto 0;font-size:12.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.tile,.tlist a,.chip,.ts{transition:border-color .15s,filter .15s}}
</style>

<header class="top" id="top">
  <h1><a href="#home">Peds Shelf Video Desk<small>Dr High Yield · Emma Holliday · Divine Intervention · Peds Board Review</small></a></h1>
  <form class="search" id="sform" role="search"><label for="q" class="eyebrow" style="position:absolute;left:-9999px">Search</label><input id="q" type="search" placeholder="Search a topic: Kawasaki, croup, SCFE, TORCH…" autocomplete="off"></form>
</header>
<div class="wrap">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<footer>Timestamps link to the original YouTube uploads. Flowcharts built from these videos plus the Divine Intervention and Mehlman PDFs.</footer>

<script src="data.js"></script>
<script src="sys.js"></script>
<script src="pbr.js"></script>
<script src="naga.js"></script>
<script src="cs.js?v=4"></script>
<script>
(()=>{
const $=s=>document.querySelector(s), main=$('#main');
const VID=Object.fromEntries(VIDS.concat(window.NAGA||[]).map(v=>[v.key,v]));if(VID.d)VID.d.noembed=true;
const LABEL={h1:'H1',h2:'H2',e:'E',d:'D'};(window.NAGA||[]).forEach(v=>LABEL[v.key]='N');
const EMBED=/github\.io$/.test(location.hostname)||/[?&]embed/.test(location.search);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b class="hy">$1</b>').replace(/__(.+?)__/g,'<u class="hy2">$1</u>');
const yt=(id,t)=>`https://www.youtube.com/watch?v=${id}${t?`&t=${Math.floor(t)}s`:''}`;
const fcPdf='Peds%20Shelf%20Approach%20Flowcharts%20v2.pdf', diPdf='Divine%20Intervention%20Ep21.pdf';
const PDFS=[
 {id:'flowcharts',short:'Approach flowcharts',title:'Peds Shelf Approach Flowcharts v2',file:fcPdf,pages:43,desc:'40 Approach to… flowcharts built from all four sources.'},
 {id:'emma',short:'Emma Holliday slides',title:'Emma Holliday Pediatrics slides',file:'Emma%20Holliday%20Pediatrics.pdf',pages:78,desc:'The question and answer slides she teaches from in the video.'},
 {id:'mehlman',short:'Mehlman HY Pediatrics',title:'Mehlman Medical HY Pediatrics',file:'Mehlman%20HY%20Pediatrics.pdf',pages:205,desc:'By system (cardio p4, pulm p11, renal p24, GI p33, heme/onc p52, repro p66, derm p90, neuro p103, psych p109, ophtho p121, MSK p127, biochem p141, endo p146) and a bullet summary from p155.'},
 {id:'divine',short:'Divine Intervention Ep 21',title:'Divine Intervention Episode 21 PDF',file:diPdf,pages:139,desc:'The 43 questions he reads through in the episode.'},
];

// sticky header height
const setH=()=>document.documentElement.style.setProperty('--toph',$('#top').offsetHeight+'px');
addEventListener('resize',setH);setH();

// systems left to study
let ORDER=(()=>{try{const o=JSON.parse(localStorage.getItem('ps_src')||'null');if(Array.isArray(o)&&o.length)return o}catch(_){}return ['e','h1','h2','d']})();
function saveOrder(){try{localStorage.setItem('ps_src',JSON.stringify(ORDER))}catch(_){}}
function segsOf(x){return x.segs.map(g=>{const [k,t]=g.split('@');const v=VID[k];const i=v.sections.findIndex(q=>q.t==+t);const sec=v.sections[i];return {k,t:+t,e:(v.sections[i+1]||{t:v.len}).t,s:sec}}).filter(c=>ORDER.includes(c.k)).sort((a,b)=>ORDER.indexOf(a.k)-ORDER.indexOf(b.k)||a.t-b.t)}
function srcBar(id){const all=['e','h1','h2','d'];return `<div class="srcbar"><span class="muted" style="font-size:13px">Lecturers, in the order you tap them:</span>${all.map(k=>{const i=ORDER.indexOf(k);return `<button type="button" class="srcb ${k}${i>=0?' on':''}" data-src="${k}" data-sys="${id}">${i>=0?`<b>${i+1}</b>`:''}${esc(VID[k].who==='Dr High Yield'?(k==='h1'?'Dr High Yield 1':'Dr High Yield 2'):VID[k].who)}</button>`}).join('')}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('.srcb');if(!b)return;e.preventDefault();e.stopPropagation();const k=b.dataset.src;const i=ORDER.indexOf(k);if(i>=0){if(ORDER.length>1)ORDER.splice(i,1)}else ORDER.push(k);saveOrder();const id=b.dataset.sys;if(id)sysView(id);else left()},true);
const mins=a=>Math.round(a.reduce((n,x)=>n+x.e-x.t,0)/60);
// rail
$('#rail').innerHTML=`<div class="lab eyebrow">Videos</div>`+VIDS.map(v=>`<a href="#${v.key}" data-r="${v.key}"><span class="k ${v.key}">${LABEL[v.key]}</span>${esc(v.key==='d'?'Divine Intervention':v.title.replace('High Yield Pediatrics, ','Dr High Yield, ').replace(' Pediatrics Review',''))}</a>`).join('')+
`<div class="sep"></div><div class="lab eyebrow">By system</div><a href="#left" data-r="left"><span class="k t">${SYS.length}</span>All systems</a>`+SYS.map(x=>`<a href="#sys-${x.id}" data-r="sys-${x.id}"><span class="k t">${segsOf(x).length}</span>${esc(x.short)}</a>`).join('')+
`<div class="sep"></div><div class="lab eyebrow">Full lectures</div><a href="#pbr" data-r="pbr"><span class="k t">${PBR.reduce((a,g)=>a+g.v.length,0)}</span>Board Review by subject</a>`+`<div class="sep"></div><div class="lab eyebrow">Cheat sheets</div>`+CS.map(x=>`<a href="#cs-${x.id}" data-r="cs-${x.id}"><span class="k t">${x.sheets.length}</span>${esc(x.name)}</a>`).join('')+`<div class="sep"></div><div class="lab eyebrow">PDFs</div>`+PDFS.map(d=>`<a href="#pdf-${d.id}" data-r="pdf-${d.id}"><span class="k t">PDF</span>${esc(d.short)}</a>`).join('')+``;

// timestamp element: button that seeks when embedded, link to YouTube otherwise
function stamp(key,t,cls,label){
  const v=VID[key];const txt=label||((v.approx?'≈ ':'')+fmt(t));
  if(EMBED&&!v.noembed) return `<button type="button" class="${cls} ${key}" data-v="${key}" data-t="${Math.floor(t)}" title="Play from ${fmt(t)}">${esc(txt)}</button>`;
  return `<a class="${cls} ${key}" href="${yt(v.id,t)}" title="Open on YouTube at ${fmt(t)}">${esc(txt)}</a>`;
}

// ---------- player (GitHub Pages copy) ----------
let curVid=null, ytp=null, ytReady=null;
function loadAPI(){
  if(!ytReady) ytReady=new Promise(r=>{window.onYouTubeIframeAPIReady=r;const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.append(sc)});
  return ytReady;
}
async function startPlayer(t){
  const key=curVid, v=VID[key];await loadAPI();
  const fr=$('#player .frame');if(!fr||curVid!==key)return;
  fr.innerHTML='<div id="ytf"></div>';
  ytp=new YT.Player('ytf',{videoId:v.id,playerVars:{start:Math.floor(t),autoplay:1,rel:0,playsinline:1,modestbranding:1,hl:'en',cc_lang_pref:'en',cc_load_policy:0,iv_load_policy:3},
    events:{onReady:e=>{try{e.target.unloadModule('captions');e.target.unloadModule('cc')}catch(_){}e.target.seekTo(Math.floor(t),true);e.target.playVideo()},
            onApiChange:e=>{try{e.target.unloadModule('captions');e.target.unloadModule('cc')}catch(_){}}}});
}
function seek(key,t){

function search(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);if(!terms.length)return route();
  const hl=s=>{let h=rich(s);terms.forEach(t=>{h=h.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![^<]*>)','gi'),'<mark>$1</mark>')});return h};
  const hits=[];
  const shHits=[];
  CS.forEach(x=>x.sheets.forEach(sh=>{const base=(x.name+' '+(x.al||'')+' '+sh.t+' '+(sh.q||'')).toLowerCase();
    const all=(base+' '+sh.g.map(g=>g.h+' '+g.x.map(c=>c.join(' ')).join(' ')).join(' ')+' '+(sh.cmp?sh.cmp.r.flat().join(' '):'')).toLowerCase().replace(/\*|_/g,'');
    if(terms.every(t=>all.includes(t)))shHits.push(csTile(x,sh));
    sh.g.forEach(g=>g.x.forEach(c=>{const txt=(base+' '+g.h+' '+c.join(' ')).toLowerCase().replace(/\*|_/g,'');if(terms.every(t=>txt.includes(t)))hits.push(`<div class="hit"><a class="chip t k" href="#cs-${x.id}-${sh.id}">${esc(sh.t)}</a><div><div class="t">${hl(c[0])}</div><div class="s">${hl(c[2]||c[1])}</div></div></div>`)}))}));
  if(0)FC.forEach(f=>{const txt=f.name.toLowerCase();if(terms.every(t=>txt.includes(t)))hits.push(`<div class="hit"><a class="chip t k" href="#t${f.n}">Chart ${f.n}</a><div><div class="t">${hl(f.name)}</div></div></div>`)});
  VIDS.concat(window.NAGA||[]).forEach(v=>v.sections.forEach(s=>{const txt=(s.title+' '+s.notes.join(' ')).toLowerCase().replace(/\*|_/g,'');if(terms.every(t=>txt.includes(t))){const n=s.notes.filter(x=>terms.some(t=>x.toLowerCase().includes(t)));hits.push(`<div class="hit">${linkTo(v.key,s.t,LABEL[v.key]+' '+(v.approx?'≈':'')+fmt(s.t))}<div><div class="t">${hl(s.title)}</div><div class="s">${(n.length?n:s.notes).slice(0,2).map(hl).join(' ')}</div></div></div>`)}}));
  curVid=null;
  main.innerHTML=`<section class="vhead"><p class="eyebrow">Search</p><h2>${hits.length+shHits.length} result${hits.length+shHits.length===1?'':'s'} for “${esc(q)}”</h2></section>${shHits.length?`<section style="display:grid;gap:10px"><p class="eyebrow">Cheat sheets</p><div class="tiles">${shHits.join('')}</div></section>`:''}<div class="hits">${hits.join('')||'<p class="muted">Nothing matched. Try one word, like "jaundice" or "stridor".</p>'}</div>`;
}
function route(){
  const h=decodeURIComponent(location.hash.slice(1));let r='home';
  document.querySelectorAll('#rail a[data-r]').forEach(a=>a.classList.remove('on'));
  let m;
  if((m=h.match(/^(h1|h2|e|d|n_[\w-]{11})(?:-t(\d+))?$/))&&VID[m[1]]){r=m[1].startsWith('n_')?'pbr':m[1];video(m[1],m[2]?+m[2]:0)}
  else if(h==='topics'||h==='cs'||/^t\d\d$/.test(h)){r='cs';csIndex()}
  else if((m=h.match(/^cs-([a-z]+)-([a-z]+)$/))){r='cs-'+m[1];csSheet(m[1],m[2])}
  else if((m=h.match(/^cs-([a-z]+)$/))){r='cs-'+m[1];csSubject(m[1])}
  else if(h==='pbr'){r='pbr';curVid=null;pbrView()}
  else if(h==='left'){r='left';left()}
  else if((m=h.match(/^sys-([a-z]+)$/))){r='sys-'+m[1];sysView(m[1])}
  else if(h==='pdfs'){r='pdfs';curVid=null;pdfs()}
  else if((m=h.match(/^pdf-([a-z]+)$/))){r='pdf-'+m[1];curVid=null;pdf(m[1])}
  else if((m=h.match(/^t(\d\d)$/))){r='topics';curVid=null;topic(m[1])}
  else {curVid=null;home()}
  const a=document.querySelector(`#rail a[data-r="${r}"]`);if(a)a.classList.add('on');
}
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>search(e.target.value.trim()),160)});
$('#sform').addEventListener('submit',e=>{e.preventDefault();search($('#q').value.trim())});
addEventListener('hashchange',()=>{$('#q').value='';route()});
route();
})();
</script>
